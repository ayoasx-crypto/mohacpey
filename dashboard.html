        <!-- الإحصائيات -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-icon">
                    💰
   
<div>
    <p>إجمالي المبيعات</p>

</div>

            </div>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    📦
                </div>

                    <p>المنتجات المباعة</p>

                </div>

            </div>

        </section>

            <div class="section-title">

                    <h2>حركة المبيعات</h2>

                </div>

                    عرض الكل
                </button>

            </div>

<div class="sales-list" id="salesList">

    <!-- سيتم عرض آخر عمليات البيع هنا من Supabase -->

</div>

        </section>




<!-- المنتجات الأكثر مبيعاً -->
