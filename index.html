<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحاسبي - لوحة المراقبة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 pb-12">
    
    <!-- Header -->
    <div class="flex items-center justify-between mb-6 pt-2">
        <div>
            <h1 class="text-2xl font-black text-emerald-400">مُحاسبي</h1>
            <p class="text-xs text-slate-400">مراقبة المبيعات اللحظية</p>
        </div>
        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-full text-xs text-emerald-400 font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
            متصل بالمنظومة
        </div>
    </div>

    <!-- Stats Cards Grid -->
    <div class="grid grid-cols-2 gap-3 mb-6">
        <!-- Total Sales -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl col-span-2">
            <p class="text-xs text-slate-400 mb-1">إجمالي المبيعات</p>
            <h2 class="text-3xl font-bold text-white"><span id="totalSales">0.00</span> <span class="text-sm font-normal text-emerald-400">د.ل</span></h2>
        </div>

        <!-- Profit -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <p class="text-xs text-slate-400 mb-1">صافي الأرباح</p>
            <h3 class="text-xl font-bold text-emerald-400"><span id="totalProfit">0.00</span> <span class="text-xs font-normal">د.ل</span></h3>
        </div>

        <!-- Invoices -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
            <p class="text-xs text-slate-400 mb-1">عدد الفواتير</p>
            <h3 class="text-xl font-bold text-sky-400" id="totalInvoices">0</h3>
        </div>
    </div>

    <!-- Live Feed Section -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h3 class="text-sm font-bold text-slate-300 mb-4 flex items-center justify-between">
            <span>آخر الفواتير المسجلة</span>
            <i class="fa-solid fa-bolt text-emerald-400 text-xs"></i>
        </h3>
        
        <div id="salesList" class="space-y-3">
            <p class="text-center text-xs text-slate-500 py-4">جاري تحميل البيانات...</p>
        </div>
    </div>

    <script>
        const MANZOMA_URL = 'https://manzoma.onrender.com/api/store-data';

        async function fetchLiveData() {
            try {
                const response = await fetch(MANZOMA_URL);
                const data = await response.json();

                document.getElementById('totalSales').innerText = data.total_sales.toFixed(2);
                document.getElementById('totalProfit').innerText = data.total_profit.toFixed(2);
                document.getElementById('totalInvoices').innerText = data.total_invoices;

                const salesList = document.getElementById('salesList');
                salesList.innerHTML = '';

                if (data.recent_sales.length === 0) {
                    salesList.innerHTML = '<p class="text-center text-xs text-slate-500 py-4">لا توجد مبيعات مسجلة حتى الآن</p>';
                    return;
                }

                data.recent_sales.forEach(sale => {
                    const item = document.createElement('div');
                    item.className = 'flex justify-between items-center bg-slate-950/50 p-3 rounded-xl border border-slate-800/50';
                    item.innerHTML = `
                        <div>
                            <p class="text-sm font-semibold text-slate-200">${sale[1]}</p>
                            <p class="text-xs text-slate-500">الكمية: ${sale[2]}</p>
                        </div>
                        <span class="text-sm font-bold text-emerald-400">${sale[3].toFixed(2)} د.ل</span>
                    `;
                    salesList.appendChild(item);
                });

            } catch (err) {
                console.error('خطأ في جلب البيانات:', err);
            }
        }

        // جلب البيانات فوراً ثم تحديثها تلقائياً كل 3 ثوانٍ
        fetchLiveData();
        setInterval(fetchLiveData, 3000);
    </script>
</body>
</html>
