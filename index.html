<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحاسبي - لوحة المراقبة</title>
    
    <!-- PWA Link -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/logo.png.jpeg">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-4 pb-12">

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="login-screen" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass p-6 rounded-3xl w-full max-w-md border border-slate-800 shadow-2xl text-center">
            <img src="/logo.png.jpeg" class="w-20 h-20 mx-auto mb-4 rounded-2xl shadow-lg border border-slate-700/50" alt="مُحاسبي">
            <h2 class="text-2xl font-black text-emerald-400 mb-1">تطبيق مُحاسبي</h2>
            <p class="text-xs text-slate-400 mb-6">سجّل دخولك لمتابعة مبيعات محلك اللحظية</p>

            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4 text-right">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">اسم المستخدم</label>
                    <input type="text" id="username" required placeholder="أدخل اسم المستخدم" class="w-full bg-slate-900 border border-slate-700/60 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">كلمة السر</label>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700/60 rounded-xl p-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
                </div>
                <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-emerald-500/20">
                    دخول المحل
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-800"></div></div>
                <div class="relative flex justify-center text-xs text-slate-500"><span class="bg-slate-950 px-2">أو</span></div>
            </div>

            <button onclick="loginDemo()" class="w-full bg-slate-900 hover:bg-slate-800 text-slate-300 font-semibold py-3 rounded-xl border border-slate-800 transition-all text-sm">
                <i class="fa-solid fa-eye text-emerald-400 ml-2"></i> تجربة المنظومة (حساب تجريبي)
            </button>
        </div>
    </div>

    <!-- 2. لوحة المراقبة الرئيسية (تظهر بعد الدخول) -->
    <div id="dashboard" class="hidden">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pt-2">
            <div>
                <h1 id="store-title" class="text-2xl font-black text-emerald-400">مُحاسبي</h1>
                <p class="text-xs text-slate-400">مراقبة المبيعات اللحظية</p>
            </div>
            <div class="flex items-center gap-2">
                <span class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span> متصل
                </span>
                <button onclick="logout()" class="bg-slate-900 border border-slate-800 p-2 rounded-xl text-slate-400 hover:text-rose-400 text-xs">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </div>

        <!-- API Key Box -->
        <div class="glass p-3 rounded-2xl mb-6 text-xs flex justify-between items-center border border-slate-800/80">
            <span class="text-slate-400">مفتاح الربط (API Key):</span>
            <code id="api-key-display" class="bg-slate-900 text-emerald-400 px-2 py-1 rounded-lg font-mono border border-slate-800">---</code>
        </div>

        <!-- Dashboard Content -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">إجمالي المبيعات</p>
                <h2 id="total-sales" class="text-xl font-black text-emerald-400">0.00 د.ل</h2>
            </div>
            <div class="bg-slate-900/80 border border-slate-800 p-4 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">صافي الأرباح</p>
                <h2 id="total-profit" class="text-xl font-black text-emerald-400">0.00 د.ل</h2>
            </div>
        </div>
    </div>

    <script>
    function switchTab(type) {
        document.getElementById('successBox').style.display = 'none';
        if (type === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
        }
    }

  // معالجة تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('store_name', data.store_name);
                localStorage.setItem('api_key', data.api_key);
                alert(`أهلاً بك مجدداً في ${data.store_name}!`);
                location.reload(); 
            } else {
                alert(data.error || 'فشل تسجيل الدخول');
            }
        } catch (err) {
            alert('تعذر الاتصال بالسيرفر');
        }
    });

    // معالجة إنشاء حساب جديد
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const store_name = document.getElementById('regStoreName').value;
    const username = document.getElementById('regUsername').value;
    const password = document.getElementById('regPassword').value;

    try {
        const res = await fetch('/api/register', {                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ store_name, username, password })
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById('apiKeyText').innerText = data.api_key;
                document.getElementById('successBox').style.display = 'block';
                document.getElementById('registerForm').reset();
            } else {
                alert(data.error || 'حدث خطأ في التسجيل');
            }
        } catch (err) {
            alert('تعذر الاتصال بالسيرفر');
        }
    });

    function copyApiKey() {
        const key = document.getElementById('apiKeyText').innerText;
        navigator.clipboard.writeText(key);
        alert('تم نسخ مفتاح الـ API بنجاح!');
    }

    function openModal() { document.getElementById('tutorialModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('tutorialModal').style.display = 'none'; }
</script>
</body>
</html>
