<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحاسبي - لوحة المبيعات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        .logo {
            width: 70px;
            height: 70px;
            border-radius: 14px;
            display: block;
            margin: 0 auto 15px auto;
            object-fit: cover;
            border: 2px solid #10b981;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #10b981;
            outline: none;
        }
        button.btn-main {
            width: 100%;
            padding: 12px;
            background: #10b981;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.btn-main:hover {
            background: #059669;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        .stat-card {
            background: #1f2937;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #374151;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 11px;
            color: #9ca3af;
            margin: 0 0 5px 0;
        }
        .stat-card p {
            font-size: 16px;
            font-weight: bold;
            color: #34d399;
            margin: 0;
        }
        .dash-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #2a3447;
            padding-bottom: 10px;
        }
        .btn-logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card">
        
        <!-- قسم تسجيل الدخول / إنشاء الحساب -->
        <div id="authSection">
            <img src="/logo.jpg" alt="مُحاسبي" class="logo" onerror="this.style.display='none'">
            <h2 style="text-align: center; font-size: 18px; margin-bottom: 15px; color: #fff;">تطبيق مُحاسبي</h2>
            
            <input type="text" id="storeNameInput" placeholder="أدخل اسم المحل...">
            <button class="btn-main" onclick="registerStore()">دخول / تسجيل المحل</button>
            <p id="authError" style="color: #ef4444; font-size: 12px; text-align: center; margin-top: 10px;"></p>
        </div>

        <!-- لوحة التحكم المتقدمة -->
        <div id="dashboardSection" style="display: none;">
            
            <!-- عنوان اللوحة في الأعلى -->
            <p style="text-align: center; font-size: 11px; color: #9ca3af; margin-bottom: 8px; letter-spacing: 0.5px;">✨ لوحة التحليلات والمبيعات المتقدمة ✨</p>

            <!-- صورة اللوجو الوحيدة -->
            <img src="/logo.jpg" alt="مُحاسبي" class="logo" style="margin-bottom: 8px;" onerror="this.style.display='none'">

            <!-- اسم المحل والرسالة الترحيبية -->
            <div style="text-align: center; margin-bottom: 15px; border-bottom: 1px solid #2a3447; padding-bottom: 12px;">
                <h2 id="displayStoreName" style="font-size: 18px; color: #fff; margin-bottom: 4px;">اسم المحل</h2>
                <p id="welcomeMessage" style="font-size: 12px; color: #34d399;"></p>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <p style="font-size: 11px; color: #9ca3af;" id="lastUpdated">آخر تحديث: الآن</p>
                <div style="display: flex; gap: 6px;">
                    <button onclick="refreshStats()" style="background: #374151; border: none; color: white; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">🔄</button>
                    <button class="btn-logout" onclick="logout()">خروج</button>
                </div>
            </div>

            <!-- بطاقات الإحصائيات -->
            <div class="stat-grid">
                <div class="stat-card">
                    <h3>إجمالي المبيعات</h3>
                    <p id="totalSales">0.00 د.ل</p>
                </div>
                <div class="stat-card">
                    <h3>إجمالي الأرباح</h3>
                    <p id="totalProfit" style="color: #38bdf8;">0.00 د.ل</p>
                </div>
            </div>

            <div class="stat-grid">
                <div class="stat-card">
                    <h3>عدد الفواتير</h3>
                    <p id="invoicesCount" style="color: #f59e0b;">0</p>
                </div>
                <div class="stat-card">
                    <h3>متوسط الفاتورة</h3>
                    <p id="avgInvoice" style="color: #a855f7;">0.00 د.ل</p>
                </div>
            </div>

            <!-- حركة المبيعات الأخيرة -->
            <div style="background: #1f2937; padding: 12px; border-radius: 12px; border: 1px solid #374151; margin-bottom: 15px;">
                <h3 style="font-size: 12px; color: #9ca3af; margin-bottom: 8px; text-align: right;">حركة المبيعات الأخيرة</h3>
                <div id="recentSalesList" style="font-size: 12px; color: #d1d5db; max-height: 130px; overflow-y: auto;">
                    <p style="text-align: center; color: #6b7280; padding: 10px;">لا توجد مبيعات مسجلة بعد</p>
                </div>
            </div>

            <div class="stat-card" style="margin-bottom: 10px;">
                <h3 style="font-size: 11px;">مفتاح الربط (API Key) الخاص بمحلك:</h3>
                <p id="displayApiKey" style="font-size: 11px; color: #38bdf8; word-break: break-all; margin-top: 5px;">-</p>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem('api_key');
            const savedName = localStorage.getItem('store_name');
            if (savedKey && savedName) {
                showDashboard(savedName, savedKey);
            }
        });

        async function registerStore() {
            const storeName = document.getElementById('storeNameInput').value.trim();
            const errorEl = document.getElementById('authError');
            if (!storeName) {
                errorEl.innerText = "يرجى إدخال اسم المحل";
                return;
            }

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ store_name: storeName })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('api_key', data.api_key);
                    localStorage.setItem('store_name', data.store_name);
                    showDashboard(data.store_name, data.api_key);
                } else {
                    errorEl.innerText = data.error || "حدث خطأ ما";
                }
            } catch (err) {
                errorEl.innerText = "تعذر الاتصال بالسيرفر";
            }
        }

        async function showDashboard(storeName, apiKey) {
            document.getElementById('authSection').style.display = 'none';
            document.getElementById('dashboardSection').style.display = 'block';
            document.getElementById('displayStoreName').innerText = storeName;
            document.getElementById('displayApiKey').innerText = apiKey;

            // رسالة ترحيبية حسب الوقت
            const hours = new Date().getHours();
            let greeting = "أهلاً بك في محلك";
            if (hours >= 4 && hours < 12) {
                greeting = "صباح النشاط والمبيعات العالية ☀️";
            } else if (hours >= 12 && hours < 17) {
                greeting = "طابت أوقاتك، استمر في التألق 🌤️";
            } else {
                greeting = "مساء الخير، حصاد يوم موفق 🌙";
            }
            document.getElementById('welcomeMessage').innerText = greeting;

            try {
                const res = await fetch(`/api/stats?api_key=${apiKey}`);
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('totalSales').innerText = `${data.total_sales.toFixed(2)} د.ل`;
                    document.getElementById('totalProfit').innerText = `${data.total_profit.toFixed(2)} د.ل`;
                    document.getElementById('invoicesCount').innerText = data.invoices_count;
                    document.getElementById('avgInvoice').innerText = `${data.avg_invoice.toFixed(2)} د.ل`;

                    const salesContainer = document.getElementById('recentSalesList');
                    if (data.recent_sales && data.recent_sales.length > 0) {
                        salesContainer.innerHTML = data.recent_sales.map(sale => `
                            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #374151; padding: 6px 0;">
                                <span>فاتورة: ${sale.invoice_id}</span>
                                <span style="color: #10b981; font-weight: bold;">+${sale.total_amount} د.ل</span>
                            </div>
                        `).join('');
                    }
                }
            } catch (err) {
                console.error('تعذر جلب الإحصائيات', err);
            }
        }

        function refreshStats() {
            const apiKey = localStorage.getItem('api_key');
            const storeName = localStorage.getItem('store_name');
            if (apiKey && storeName) {
                showDashboard(storeName, apiKey);
                const updateTime = document.getElementById('lastUpdated');
                const now = new Date();
                updateTime.innerText = `آخر تحديث: ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
            }
        }

        function logout() {
            localStorage.removeItem('api_key');
            localStorage.removeItem('store_name');
            location.reload();
        }
    </script>
</body>
</html>
