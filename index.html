<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق مُحاسبي</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        body { background: #0b0f19; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #151c2c; padding: 25px; border-radius: 20px; border: 1px solid #2a3447; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { width: 70px; height: 70px; display: block; margin: 0 auto 10px auto; border-radius: 14px; }
        h1 { font-size: 20px; color: #10b981; text-align: center; margin-bottom: 5px; }
        p.subtitle { color: #9ca3af; font-size: 13px; text-align: center; margin-bottom: 20px; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; background: #1f2937; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: transparent; color: #9ca3af; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .tab-btn.active { background: #10b981; color: #fff; }

        .form-group { margin-bottom: 12px; text-align: right; }
        label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        input { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #374151; background: #1f2937; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #10b981; }

        .btn-submit { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-submit:hover { background: #059669; }

        .btn-tutorial { width: 100%; padding: 10px; background: transparent; border: 1px solid #374151; border-radius: 8px; color: #38bdf8; font-size: 13px; margin-top: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .success-box { display: none; margin-top: 15px; padding: 15px; background: #064e3b; border: 1px solid #10b981; border-radius: 10px; text-align: center; }
        .api-key-display { background: #111827; padding: 8px; border-radius: 6px; color: #34d399; font-family: monospace; font-size: 15px; margin: 8px 0; word-break: break-all; border: 1px dashed #10b981; }
        .btn-copy { background: #3b82f6; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 5px; }

        /* تنسيقات لوحة التحكم Dashboard */
        .dash-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3447; padding-bottom: 15px; margin-bottom: 15px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-card { background: #1f2937; padding: 15px; border-radius: 12px; border: 1px solid #374151; text-align: center; }
        .stat-card h3 { font-size: 11px; color: #9ca3af; margin-bottom: 5px; }
        .stat-card p { font-size: 18px; font-weight: bold; color: #10b981; }
        .btn-logout { background: #ef4444; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <img src="logo.png" alt="مُحاسبي" class="logo" onerror="this.style.display='none'">

    <!-- قسم تسجيل الدخول وإنشاء الحساب -->
    <div id="authSection">
        <h1>تطبيق مُحاسبي</h1>
        <p class="subtitle">متابعة مبيعات محلك من موبايلك لحظياً</p>

        <div class="tab-buttons">
            <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">تسجيل الدخول</button>
            <button class="tab-btn" id="registerTab" onclick="switchTab('register')">إنشاء حساب جديد</button>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <div class="form-group">
                <label>اسم المستخدم</label>
                <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم" required>
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">دخول المحل</button>
        </form>

        <!-- نموذج إنشاء حساب جديد -->
        <form id="registerForm" style="display: none;">
            <div class="form-group">
                <label>اسم المحل / التاجر</label>
                <input type="text" id="regStoreName" placeholder="مثال: محل الأمل" required>
            </div>
            <div class="form-group">
                <label>اسم المستخدم (للدخول مستقبلاً)</label>
                <input type="text" id="regUsername" placeholder="مثال: alamal_store" required>
            </div>
            <div class="form-group">
                <label>كلمة السر</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">إنشاء الحساب والحصول على المفتاح</button>
        </form>

        <!-- صندوق عرض الـ API Key -->
        <div id="successBox" class="success-box">
            <h3 style="margin: 0 0 5px 0; font-size: 15px; color: #34d399;">🎉 تم إنشاء الحساب بنجاح!</h3>
            <p style="font-size: 12px; margin: 0; color: #d1fae5;">هذا هو مفتاح الربط (API Key) الخاص بمحلك:</p>
            <div id="apiKeyText" class="api-key-display">KEY-XXXXXXXX</div>
            <button class="btn-copy" onclick="copyApiKey()">📋 نسخ مفتاح الربط</button>
        </div>
    </div>

    <!-- قسم لوحة التحكم الداخلي Dashboard -->
    <div id="dashboardSection" style="display: none;">
        <div class="dash-header">
            <div>
                <h2 id="displayStoreName" style="font-size: 16px; color: #fff;">اسم المحل</h2>
                <p style="font-size: 11px; color: #9ca3af;">لوحة متابعة المبيعات</p>
            </div>
            <button class="btn-logout" onclick="logout()">خروج</button>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <h3>إجمالي المبيعات</h3>
                <p id="totalSales">0.00 د.ل</p>
            </div>
            <div class="stat-card">
                <h3>إجمالي الأرباح</h3>
                <p id="totalProfit">0.00 د.ل</p>
            </div>
        </div>

        <div class="stat-card" style="margin-bottom: 15px;">
            <h3>مفتاح الربط (API Key) الخاص بك:</h3>
            <p id="displayApiKey" style="font-size: 12px; color: #38bdf8; word-break: break-all; margin-top: 5px;">-</p>
        </div>
    </div>
</div>

<script>
    // التحقق التلقائي عند فتح الصفحة
    window.onload = function() {
        const storeName = localStorage.getItem('store_name');
        const apiKey = localStorage.getItem('api_key');
        if (storeName && apiKey) {
            showDashboard(storeName, apiKey);
        }
    };

    function switchTab(type) {
        document.getElementById('successBox').style.display = 'none';
        if (type === 'login') {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginTab').classList.add('active');
            document.getElementById('registerTab').classList.remove('active');
        } else {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('registerTab').classList.add('active');
            document.getElementById('loginTab').classList.remove('active');
        }
    }

    // تسجيل الدخول
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('store_name', data.store_name);
                localStorage.setItem('api_key', data.api_key);
                showDashboard(data.store_name, data.api_key);
            } else {
                alert(data.error || 'فشل تسجيل الدخول');
            }
        } catch (err) {
            alert('تعذر الاتصال بالسيرفر');
        }
    });

    // إنشاء حساب جديد
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const store_name = document.getElementById('regStoreName').value;
        const username = document.getElementById('regUsername').value;
        const password = document.getElementById('regPassword').value;

        try {
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ store_name, username, password })
            });
            const data = await res.json();

            if (res.ok) {
                document.getElementById('apiKeyText').innerText = data.api_key;
                document.getElementById('successBox').style.display = 'block';
                document.getElementById('registerForm').reset();
            } else {
                alert(data.error || 'حدث خطأ في التسجيل');
            }
        } catch (err) {
            alert('تعذر الاتصال بالسيرفر');
        }
    });

    function showDashboard(storeName, apiKey) {
        document.getElementById('authSection').style.display = 'none';
        document.getElementById('dashboardSection').style.display = 'block';
        document.getElementById('displayStoreName').innerText = storeName;
        document.getElementById('displayApiKey').innerText = apiKey;
    }

    function logout() {
        localStorage.clear();
        document.getElementById('dashboardSection').style.display = 'none';
        document.getElementById('authSection').style.display = 'block';
    }

    function copyApiKey() {
        const key = document.getElementById('apiKeyText').innerText;
        navigator.clipboard.writeText(key);
        alert('تم نسخ مفتاح الـ API بنجاح!');
    }
</script>

</body>
</html>
